[package]
name = "fujin-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 WITH Commons-Clause"

# Thin, independently-deployed HTTP/MCP wrapper around the `fujin` lib.
# Boundary-clean: validates a platform-issued signed token via a configured
# shared key (layer_kit::auth) and never references mcpbox. The axum/tokio
# scaffold is layer_kit::serve; this crate supplies only its own dispatch.
# Its own deploy unit (own systemd service).
[dependencies]
fujin = { path = ".." }
layer-kit = { git = "https://github.com/tupical/layer-kit", features = ["server", "storage"] }
axum = "0.7"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
