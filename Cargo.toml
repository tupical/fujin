[package]
name = "actions-oss"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 WITH Commons-Clause"

[lib]
path = "src/lib.rs"

[dependencies]
# Self-contained skeleton: NO taskagent-* and NO sibling *_oss deps.
# Every primitive / domain / contract type is local. Cross-layer wiring
# (e.g. ActionPacket::from_brief(PlanBrief), real taskagent dispatch) is
# supplied by mcpbox — implementations live only inside mcpbox, never here.
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid       = { version = "1.10", features = ["v7", "serde"] }
